<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма реєстрації</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Реєстрація</h1>
        <form id="registrationForm" class="registration-form">
            <div class="form-group">
                <label for="name">Ім'я *</label>
                <input type="text" id="name" name="name" placeholder="Введіть ваше ім'я">
                <span class="error-message" id="nameError"></span>
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" placeholder="example@email.com">
                <span class="error-message" id="emailError"></span>
            </div>

            <div class="form-group">
                <label for="password">Пароль *</label>
                <input type="password" id="password" name="password" placeholder="Мінімум 6 символів">
                <span class="error-message" id="passwordError"></span>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Повтор пароля *</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Повторіть пароль">
                <span class="error-message" id="confirmPasswordError"></span>
            </div>

            <button type="submit" class="submit-btn">Зареєструватися</button>
        </form>
        
        <div id="successMessage" class="success-message"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
